<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LKSMILITAR - Biblioteca Técnica</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
    html, body { width: 100%; min-height: 100dvh; background: #0b0f19; color: #f8fafc; overflow-x: hidden; }

    .sidebar {
      position: fixed; top: 12px; left: 12px;
      height: calc(100dvh - 24px); width: 78px;
      background: #111827; border-radius: 18px; border: 1px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      padding: 10px 12px; z-index: 99;
      transition: width 0.35s ease, transform 0.35s ease;
      display: flex; flex-direction: column;
    }
    .sidebar.open { width: 270px; }
    .sidebar .logo-details { height: 52px; display: flex; align-items: center; position: relative; }
    .sidebar .logo-details .icon { color: #38bdf8; font-size: 24px; min-width: 50px; text-align: center; }
    .sidebar .logo-details .logo_name { color: #f8fafc; font-size: 15px; font-weight: 700; opacity: 0; transition: 0.3s; white-space: nowrap; }
    .sidebar.open .logo-details .logo_name { opacity: 1; }
    .sidebar .logo-details #btn { position: absolute; right: 0; font-size: 22px; color: #94a3b8; cursor: pointer; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

    .sidebar .search-box { position: relative; margin: 8px 0; }
    .sidebar .search-box input {
      font-size: 13px; color: #f8fafc; outline: none; height: 40px; width: 100%;
      border: 1px solid #1e293b; border-radius: 10px; background: #0f172a; padding: 0 10px 0 42px;
    }
    .sidebar .search-box .bx-search { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); font-size: 18px; color: #94a3b8; }

    .sidebar .nav-list { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 4px; }
    .sidebar .nav-list::-webkit-scrollbar { width: 3px; }
    .sidebar .nav-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .sidebar li { position: relative; margin: 4px 0; list-style: none; }
    .sidebar li a { display: flex; height: 44px; width: 100%; border-radius: 10px; align-items: center; text-decoration: none; transition: 0.2s; cursor: pointer; }
    .sidebar li a:hover, .sidebar li a.active { background: #1e293b; }
    .sidebar li i { height: 44px; min-width: 50px; font-size: 18px; text-align: center; line-height: 44px; color: #38bdf8; }
    .sidebar li a .links_name { color: #cbd5e1; font-size: 13px; font-weight: 500; opacity: 0; white-space: nowrap; transition: 0.3s; }
    .sidebar.open li a .links_name { opacity: 1; }

    .sidebar .profile {
      height: 48px; width: 100%; background: #0f172a; border-radius: 10px; border: 1px solid #1e293b;
      display: flex; align-items: center; padding: 0 6px; position: relative; overflow: hidden; margin-top: 8px;
    }
    .sidebar .profile .name { font-size: 12px; font-weight: 600; color: #f8fafc; opacity: 0; transition: opacity 0.3s ease; }
    .sidebar .profile .job { font-size: 10px; color: #94a3b8; opacity: 0; transition: opacity 0.3s ease; }
    .sidebar.open .profile .name, .sidebar.open .profile .job { opacity: 1; }

    .sidebar-backdrop {
      position: fixed; inset: 0; background: rgba(11, 15, 25, 0.6);
      backdrop-filter: blur(2px); z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

    .home-section { margin-left: 102px; padding: 24px 32px; transition: margin-left 0.35s ease; width: calc(100% - 102px); }
    .sidebar.open ~ .home-section { margin-left: 298px; width: calc(100% - 298px); }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 24px; background: #111827; padding: 16px 24px;
      border-radius: 14px; border: 1px solid #1e293b;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title h1 { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .header-title p { font-size: 13px; color: #94a3b8; }

    .mobile-toggle {
      display: none; border: 1px solid #1e293b; background: #0f172a; color: #f8fafc;
      font-size: 22px; cursor: pointer; min-width: 44px; min-height: 44px;
      border-radius: 10px; align-items: center; justify-content: center; transition: 0.2s;
    }

    .view-toggle { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #1e293b; }
    .toggle-btn {
      border: none; background: transparent; padding: 8px 12px; min-width: 44px; min-height: 44px;
      border-radius: 6px; cursor: pointer; color: #94a3b8; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .toggle-btn.active { background: #1e293b; color: #38bdf8; }

    .pdf-container.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .pdf-container.grid-mode .pdf-card {
      background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 14px;
      display: flex; flex-direction: column; align-items: center; transition: transform 0.2s, border-color 0.2s; cursor: pointer;
    }
    .pdf-container.grid-mode .pdf-card:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .pdf-container.grid-mode .cover-wrapper {
      width: 100%; height: 190px; background: #0f172a; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #1e293b; margin-bottom: 12px;
    }
    .pdf-container.grid-mode .cover-img { width: 100%; height: 100%; object-fit: contain; }
    .pdf-container.grid-mode .pdf-title { font-size: 13px; font-weight: 600; color: #f8fafc; text-align: center; word-break: break-word; }
    .pdf-container.grid-mode .pdf-meta { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    .pdf-container.list-mode { display: flex; flex-direction: column; gap: 10px; }
    .pdf-container.list-mode .pdf-card {
      background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; transition: border-color 0.2s;
    }
    .pdf-container.list-mode .pdf-card:hover { border-color: #38bdf8; }
    .pdf-container.list-mode .list-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
    .pdf-container.list-mode .cover-wrapper { width: 36px; height: 48px; background: #0f172a; border-radius: 4px; overflow: hidden; border: 1px solid #1e293b; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .pdf-container.list-mode .cover-img { width: 100%; height: 100%; object-fit: cover; }
    .pdf-container.list-mode .pdf-info { min-width: 0; flex: 1; }
    .pdf-container.list-mode .pdf-title { font-size: 13.5px; font-weight: 500; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-container.list-mode .pdf-meta { font-size: 11px; color: #94a3b8; }
    .pdf-container.list-mode .btn-open { font-size: 12px; font-weight: 600; color: #38bdf8; background: #0f172a; padding: 8px 14px; border-radius: 6px; flex-shrink: 0; border: 1px solid #1e293b; }

    .pagination-wrapper { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
    .page-btn {
      background: #111827; border: 1px solid #1e293b; color: #94a3b8; padding: 8px 14px; min-width: 44px; min-height: 44px;
      border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .page-btn.active { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; font-weight: 700; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(4px); z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #111827; width: 100%; max-width: 1000px; height: 100%; max-height: 90dvh;
      border-radius: 16px; border: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-header { padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .modal-header h3 { font-size: 14px; color: #f8fafc; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-controls { display: flex; align-items: center; gap: 8px; }
    .modal-close { background: transparent; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .modal-body { flex: 1; width: 100%; height: 100%; background: #000; position: relative; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex !important; }
      .sidebar {
        position: fixed !important; top: 0 !important; left: 0 !important;
        height: 100dvh !important; width: 280px !important;
        border-radius: 0 18px 18px 0 !important;
        transform: translateX(-100%) !important;
        z-index: 999 !important; margin: 0 !important;
      }
      .sidebar.open { transform: translateX(0) !important; }
      .sidebar.open .logo-details .logo_name,
      .sidebar.open li a .links_name,
      .sidebar.open .profile .name,
      .sidebar.open .profile .job { opacity: 1 !important; pointer-events: auto !important; }
      .home-section, .sidebar.open ~ .home-section {
        margin-left: 0 !important; width: 100% !important; max-width: 100vw !important; padding: 12px !important;
      }
      .header-bar { padding: 12px 16px !important; margin-bottom: 16px !important; }
      .modal-content { max-height: 100dvh !important; border-radius: 0 !important; }
      .modal-overlay { padding: 0 !important; }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="backdrop"></div>

  <nav class="sidebar" id="sidebar">
    <div class="logo-details">
      <i class='bx bxs-paper-plane icon'></i>
      <div class="logo_name">LKSMILITAR</div>
      <i class='bx bx-menu' id="btn" aria-label="Menu"></i>
    </div>

    <div class="search-box">
      <i class='bx bx-search'></i>
      <input type="text" id="search-input" placeholder="Pesquisar no acervo...">
    </div>

    <ul class="nav-list" id="menu-list"></ul>

    <div class="profile">
      <div class="profile-details">
        <i class='bx bx-book-bookmark' style="font-size: 20px; min-width: 38px; text-align: center; color: #38bdf8;"></i>
        <div>
          <div class="name">LKSMILITAR</div>
          <div class="job">Acervo Técnico</div>
        </div>
      </div>
    </div>
  </nav>

  <main class="home-section">
    <header class="header-bar">
      <div class="header-left">
        <button class="mobile-toggle" id="mobile-toggle-btn" aria-label="Abrir Menu">
          <i class='bx bx-menu'></i>
        </button>
        <div class="header-title">
          <h1 id="modulo-titulo">Coleção Asas de Guerra</h1>
          <p id="modulo-subtitulo">Consulta técnica de edições e manuais táticos.</p>
        </div>
      </div>

      <div class="view-toggle">
        <button class="toggle-btn active" id="btn-grid" aria-label="Modo Grade"><i class='bx bx-grid-alt'></i></button>
        <button class="toggle-btn" id="btn-list" aria-label="Modo Lista"><i class='bx bx-list-ul'></i></button>
      </div>
    </header>

    <section id="pdf-container" class="pdf-container grid-mode"></section>
    <nav id="pagination-container" class="pagination-wrapper"></nav>
  </main>

  <div id="modal-viewer" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modal-title">Documento</h3>
        <div class="modal-controls">
          <a id="modal-download" href="#" target="_blank" download class="btn-open" style="text-decoration:none; font-size:12px;">Baixar</a>
          <button class="modal-close" id="modal-close-btn" aria-label="Fechar Leitor">&times;</button>
        </div>
      </header>
      <div class="modal-body">
        <iframe id="pdf-iframe" src="about:blank" title="Visualizador de PDF"></iframe>
      </div>
    </div>
  </div>

  <script>
    const R2_PUBLIC_BASE_URL = "https://pub-dfac5265440e49cd865941281f2a36c6.r2.dev";
    
    const colecaoAsasArquivos = [
      "Asas de Guerra (Planeta) - 01_text.pdf", "Asas de Guerra (Planeta) - 02_text.pdf",
      "Asas de Guerra (Planeta) - 03_text.pdf", "Asas de Guerra (Planeta) - 04_text.pdf",
      "Asas de Guerra (Planeta) - 05_text.pdf", "Asas de Guerra (Planeta) - 06_text.pdf",
      "Asas de Guerra (Planeta) - 07_text.pdf", "Asas de Guerra (Planeta) - 08_text.pdf",
      "Asas de Guerra (Planeta) - 09_text.pdf", "Asas de Guerra (Planeta) - 10_text.pdf",
      "Asas de Guerra (Planeta) - 11_text.pdf", "Asas de Guerra (Planeta) - 12_text.pdf",
      "Asas de Guerra (Planeta) - 13_text.pdf", "Asas de Guerra (Planeta) - 14_text.pdf",
      "Asas de Guerra (Planeta) - 15_text.pdf", "Asas de Guerra (Planeta) - 16_text.pdf",
      "Asas de Guerra (Planeta) - 17_text.pdf", "Asas de Guerra (Planeta) - 18_text.pdf",
      "Asas de Guerra (Planeta) - 19_text.pdf", "Asas de Guerra (Planeta) - 20_text.pdf",
      "Asas de Guerra (Planeta) - 21_text.pdf", "Asas de Guerra (Planeta) - 22_text.pdf",
      "Asas de Guerra (Planeta) - 23_text.pdf", "Asas de Guerra (Planeta) - 24_text.pdf",
      "Asas de Guerra (Planeta) - 25_text.pdf", "Asas de Guerra (Planeta) - 26_text.pdf",
      "Asas de Guerra (Planeta) - 27_text.pdf", "Asas de Guerra (Planeta) - 28_text.pdf",
      "Asas de Guerra (Planeta) - 29_text.pdf", "Asas de Guerra (Planeta) - 30_text.pdf",
      "Asas de Guerra (Planeta) - 31_text.pdf", "Asas de Guerra (Planeta) - 32_text.pdf",
      "Asas de Guerra (Planeta) - 33_text.pdf", "Asas de Guerra (Planeta) - 34_text.pdf",
      "Asas de Guerra (Planeta) - 35_text.pdf", "Asas de Guerra (Planeta) - 36_text.pdf",
      "Asas de Guerra (Planeta) - 37_text.pdf", "Asas de Guerra (Planeta) - 38_text.pdf",
      "Asas de Guerra (Planeta) - 40_text.pdf", "Asas de Guerra (Planeta) - 41_text.pdf",
      "Asas de Guerra (Planeta) - 42_text.pdf", "Asas de Guerra (Planeta) - 48_text.pdf",
      "Asas de Guerra (Planeta) - 49_text.pdf", "Asas de Guerra (Planeta) - 51_text.pdf",
      "Asas de Guerra (Planeta) - 54_text.pdf"
    ];

    const modulos = [
      { id: "collection-asas", nome: "Coleção Asas de Guerra", icon: "bx-folder", pastaR2: "collection-asas", lista: colecaoAsasArquivos },
      { id: "testes-dtic", nome: "Testes DTIC", icon: "bx-file", pastaR2: "testes-dtic", lista: [] }
    ];

    let listaCompletaPDFs = [];
    let listaFiltradaPDFs = [];
    let paginaAtual = 1;
    const itensPorPagina = 12;
    let moduloAtivo = "collection-asas";
    let modalAberto = false;

    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    const container = document.getElementById('pdf-container');
    const searchInput = document.getElementById('search-input');
    const mobileToggleBtn = document.getElementById('mobile-toggle-btn');

    function renderizarMenu() {
      const menuContainer = document.getElementById('menu-list');
      menuContainer.innerHTML = '';
      modulos.forEach(m => {
        const li = document.createElement('li');
        li.innerHTML = `
          <a class="${m.id === moduloAtivo ? 'active' : ''}" data-id="${m.id}">
            <i class='bx ${m.icon}'></i>
            <span class="links_name">${m.nome}</span>
          </a>
        `;
        li.querySelector('a').addEventListener('click', () => {
          fecharMenuMobile();
          carregarModulo(m.id);
        });
        menuContainer.appendChild(li);
      });
    }

    function fecharMenuMobile() {
      sidebar.classList.remove('open');
      backdrop.classList.remove('active');
    }

    function carregarModulo(idPasta) {
      moduloAtivo = idPasta;
      const mod = modulos.find(m => m.id === idPasta) || modulos[0];

      document.getElementById('modulo-titulo').innerText = mod.nome;
      document.getElementById('modulo-subtitulo').innerText = `Consulta de acervo e materiais técnicos de ${mod.nome}.`;

      renderizarMenu();

      listaCompletaPDFs = mod.lista.map(nomeArquivo => {
        const urlArquivo = `${R2_PUBLIC_BASE_URL}/${mod.pastaR2}/${encodeURIComponent(nomeArquivo)}`;
        const tituloLimpo = nomeArquivo.replace('_text.pdf', '').replace('.pdf', '');
        return {
          nome: tituloLimpo,
          tamanhoFormatado: "PDF",
          capaUrl: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z'/></svg>",
          previewUrl: `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(urlArquivo)}`,
          downloadUrl: urlArquivo
        };
      });

      listaFiltradaPDFs = [...listaCompletaPDFs];
      searchInput.value = '';
      paginaAtual = 1;
      renderizarPaginaAtual();
    }

    function renderizarPaginaAtual() {
      container.innerHTML = '';
      if (listaFiltradaPDFs.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; font-size:14px; grid-column: 1/-1;">Nenhum documento cadastrado neste módulo.</p>';
        document.getElementById('pagination-container').innerHTML = '';
        return;
      }

      const inicio = (paginaAtual - 1) * itensPorPagina;
      const fim = paginaAtual * itensPorPagina;
      const pdfsDaPagina = listaFiltradaPDFs.slice(inicio, fim);

      pdfsDaPagina.forEach((pdf) => {
        const card = document.createElement('div');
        card.className = 'pdf-card';
        card.innerHTML = `
          <div class="list-left">
            <div class="cover-wrapper">
              <img src="${pdf.capaUrl}" alt="Capa de ${pdf.nome}" class="cover-img" loading="lazy">
            </div>
            <div class="pdf-info">
              <div class="pdf-title">${pdf.nome}</div>
              <div class="pdf-meta">${pdf.tamanhoFormatado}</div>
            </div>
          </div>
          <div class="btn-open">Abrir Documento</div>
        `;
        card.addEventListener('click', () => abrirLeitorPDF(pdf.nome, pdf.previewUrl, pdf.downloadUrl));
        container.appendChild(card);
      });

      renderizarControlesPaginacao();
    }

    function renderizarControlesPaginacao() {
      const containerPaginacao = document.getElementById('pagination-container');
      const totalPaginas = Math.ceil(listaFiltradaPDFs.length / itensPorPagina);

      if (totalPaginas <= 1) {
        containerPaginacao.innerHTML = '';
        return;
      }

      let html = `<button class="page-btn" ${paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">Anterior</button>`;
      for (let i = 1; i <= totalPaginas; i++) {
        html += `<button class="page-btn ${i === paginaAtual ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">Próximo</button>`;

      containerPaginacao.innerHTML = html;
    }

    function mudarPagina(novaPagina) {
      paginaAtual = novaPagina;
      renderizarPaginaAtual();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function abrirLeitorPDF(nome, previewUrl, downloadUrl) {
      modalAberto = true;
      document.getElementById('modal-title').innerText = nome;
      document.getElementById('modal-download').href = downloadUrl;
      document.getElementById('pdf-iframe').src = previewUrl;
      document.getElementById('modal-viewer').classList.add('active');
    }

    function fecharLeitorPDF() {
      modalAberto = false;
      document.getElementById('pdf-iframe').src = 'about:blank';
      document.getElementById('modal-viewer').classList.remove('active');
    }

    document.getElementById('modal-close-btn').addEventListener('click', fecharLeitorPDF);

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Escape' && modalAberto) fecharLeitorPDF();
    });

    searchInput.addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase().trim();
      listaFiltradaPDFs = listaCompletaPDFs.filter(pdf => pdf.nome.toLowerCase().includes(termo));
      paginaAtual = 1;
      renderizarPaginaAtual();
    });

    function alternarMenu() {
      sidebar.classList.toggle('open');
      if (window.innerWidth <= 768) {
        backdrop.classList.toggle('active', sidebar.classList.contains('open'));
      }
    }

    document.getElementById('btn').addEventListener('click', alternarMenu);
    if (mobileToggleBtn) mobileToggleBtn.addEventListener('click', alternarMenu);
    backdrop.addEventListener('click', fecharMenuMobile);

    document.getElementById('btn-grid').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-list').classList.remove('active');
      container.className = 'pdf-container grid-mode';
    });

    document.getElementById('btn-list').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-grid').classList.remove('active');
      container.className = 'pdf-container list-mode';
    });

    document.addEventListener("DOMContentLoaded", () => {
      carregarModulo('collection-asas');
    });
  </script>
</body>
</html>
