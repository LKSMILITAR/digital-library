    :root {
      --bg-main: #06090e;
      --bg-card: #0d131e;
      --bg-card-hover: #141c2d;
      --border-color: #1e293b;
      --border-accent: rgba(56, 189, 248, 0.3);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    html, body { width: 100%; min-height: 100dvh; background: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 75%);
      pointer-events: none; z-index: 0;
    }

    .sidebar {
      position: fixed; top: 0; left: 0; height: 100dvh; width: 280px;
      background: #090e17; border-right: 1px solid var(--border-color);
      padding: 16px 12px; z-index: 999; transition: transform 0.3s ease;
      display: flex; flex-direction: column; backdrop-filter: blur(10px);
    }
    
    .logo-details { height: 50px; display: flex; align-items: center; justify-content: space-between; position: relative; margin-bottom: 20px; padding: 0 8px; }
    .logo-left { display: flex; align-items: center; gap: 10px; }
    .logo-details i.icon { color: var(--accent-color); font-size: 26px; }
    .logo-name { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }
    .logo-details #btn-close-sidebar { font-size: 24px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box input {
      font-size: 13px; color: var(--text-main); outline: none; height: 42px; width: 100%;
      border: 1px solid var(--border-color); border-radius: 8px; background: #05080f; padding: 0 12px 0 42px;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
    .search-box i { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); font-size: 18px; color: var(--text-muted); }

    .nav-list { flex: 1; overflow-y: auto; list-style: none; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { display: flex; height: 44px; border-radius: 8px; align-items: center; text-decoration: none; transition: 0.2s; cursor: pointer; border: 1px solid transparent; padding: 0 12px; gap: 12px; }
    .nav-list a:hover, .nav-list a.active { background: var(--bg-card-hover); border-color: var(--border-accent); }
    .nav-list a i { font-size: 20px; color: var(--accent-color); }
    .nav-list a .link-name { color: #cbd5e1; font-size: 13px; font-weight: 600; white-space: nowrap; }

    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 998; opacity: 0; pointer-events: none; transition: 0.3s; }
    .sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

    .main-wrapper { margin-left: 0; padding: 16px; width: 100%; position: relative; z-index: 1; }

    .top-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 20px; background: var(--bg-card); padding: 14px 18px; border-radius: 12px;
      border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-left-group { display: flex; align-items: center; gap: 12px; }
    .btn-open-sidebar {
      background: #05080f; border: 1px solid var(--border-color); color: var(--accent-color);
      width: 40px; height: 40px; border-radius: 8px; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .btn-open-sidebar:hover { border-color: var(--accent-color); }

    .header-info h1 { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .header-info p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    .view-controls { display: flex; gap: 4px; background: #05080f; padding: 3px; border-radius: 8px; border: 1px solid var(--border-color); }
    .view-btn {
      border: none; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer;
      color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .view-btn.active { background: var(--bg-card-hover); color: var(--accent-color); border: 1px solid var(--border-accent); }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    
    .book-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; transition: transform 0.25s ease, border-color 0.25s ease;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .book-card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
    
    .cover-container {
      width: 100%; height: 190px; background: #04070d; border-radius: 6px; overflow: hidden;
      border: 1px solid var(--border-color); margin-bottom: 8px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .cover-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .fallback-cover {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 12px; text-align: center; width: 100%; height: 100%; background: #070c16;
    }
    .fallback-cover i { font-size: 36px; color: var(--accent-color); }
    .fallback-cover span { font-size: 11px; font-weight: 700; color: #cbd5e1; line-height: 1.2; }

    .book-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .book-title { font-size: 12px; font-weight: 700; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; color: var(--accent-color); background: var(--accent-glow); padding: 2px 6px; border-radius: 4px; display: inline-block; width: fit-content; border: 1px solid var(--border-accent); }

    .catalog-grid.list-view { display: flex; flex-direction: column; gap: 8px; }
    .catalog-grid.list-view .book-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .catalog-grid.list-view .cover-container { width: 36px; height: 48px; margin-bottom: 0; flex-shrink: 0; }
    .catalog-grid.list-view .book-details { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; margin-left: 12px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 28px; }
    .page-link {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      width: 36px; height: 36px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .page-link.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 800; }
    .page-link:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(3, 5, 9, 0.92); backdrop-filter: blur(8px);
      z-index: 999; display: none; align-items: center; justify-content: center; padding: 10px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-window {
      background: var(--bg-card); width: 100%; max-width: 1200px; height: 100%; max-height: 96dvh;
      border-radius: 12px; border: 1px solid var(--border-accent); display: flex; flex-direction: column; overflow: hidden;

    .modal-topbar { padding: 12px 16px; background: #070b12; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-topbar h3 { font-size: 13px; font-weight: 700; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    .modal-close-btn { background: transparent; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; }
    .modal-frame-container { flex: 1; width: 100%; height: 100%; background: #000; }
    .modal-frame-container iframe { width: 100%; height: 100%; border: none; }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
    }
    @media (min-width: 1025px) {
      .main-wrapper { margin-left: 280px; width: calc(100% - 280px); }
      .btn-open-sidebar { display: none; }
      .sidebar { transform: translateX(0); }
    }
  </style>
</head>

          <a class="${m.id === moduloAtivo ? 'active' : ''}" data-id="${m.id}">
            <i class='bx ${m.icon}'></i>
            <span class="link-name">${m.nome}</span>
          </a>
        `;
        li.querySelector('a').addEventListener('click', () => {
          if (sidebar.classList.contains('open')) toggleSidebar();
          carregarModulo(m.id);
        });
        menuContainer.appendChild(li);
      });
    }

    function carregarModulo(idModulo) {
      moduloAtivo = idModulo;
      const mod = modulos.find(m => m.id === idModulo) || modulos[0];

      document.getElementById('modulo-titulo').innerHTML = `<i class='bx ${mod.icon}' style="color:var(--accent-color)"></i> ${mod.nome}`;
      document.getElementById('modulo-subtitulo').innerText = mod.subtitulo;

      renderizarMenu();

      if (mod.tipo === "custom") {
        catalogData = mod.dados.map(item => {
          const baseName = item.pdf.replace(".pdf", "");
          const capaNome = `${baseName}-001.jpg`;
          const capaAlt = `${baseName}-01.jpg`;
          const capaClean = `${baseName}.jpg`;

          return {
            titulo: item.titulo,
            pdf_url: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(item.pdf)}`,
            capa_url: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(capaNome)}`,
            capa_alt: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(capaAlt)}`,
            capa_clean: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(capaClean)}`,
            formato: item.badge || "PDF"
          };
        });
      } else {
        catalogData = mod.lista.map(file => {
          const imgName = file.replace(".pdf", ".jpg");
          const baseName = file.replace("_text.pdf", "").replace(".pdf", "").replace("_Osprey", "");
          const num = baseName.split("-").pop().replace("_", "").trim();
          
          return {
            titulo: `${mod.prefixoTitulo}${num}`,
            pdf_url: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(file)}`,
            capa_url: `${R2_BASE}/${mod.pastaR2}/${encodeURIComponent(imgName)}`,
            formato: "PDF"
          };
        });
      }

      filteredData = [...catalogData];
      searchInput.value = '';
      currentPage = 1;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      catalogContainer.innerHTML = '';
      
      if (filteredData.length === 0) {
        catalogContainer.innerHTML = '<p style="color:var(--text-muted); font-size:13px; padding: 20px;">Nenhum documento localizado.</p>';
        paginationContainer.innerHTML = '';
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = currentPage * itemsPerPage;
      const pageItems = filteredData.slice(start, end);

      pageItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'book-card';
        
        card.innerHTML = `
          <div class="cover-container">
            <img src="${item.capa_url}" alt="${item.titulo}" loading="lazy" 
                 onerror="if (!this.dataset.triedAlt) { this.dataset.triedAlt='1'; this.src='${item.capa_alt || ''}'; } else if (!this.dataset.triedClean) { this.dataset.triedClean='1'; this.src='${item.capa_clean || ''}'; } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }">
            <div class="fallback-cover" style="display:none;">
              <i class='bx bxs-file-pdf'></i>
              <span>${item.formato}</span>
            </div>
          </div>
          <div class="book-details">
            <div class="book-title">${item.titulo}</div>
            <span class="book-badge">${item.formato}</span>
          </div>
        `;
        card.addEventListener('click', () => openReader(item.titulo, item.pdf_url));
        catalogContainer.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / itemsPerPage);
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let html = `<button class="page-link" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class='bx bx-chevron-left'></i></button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-link ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-link" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})"><i class='bx bx-chevron-right'></i></button>`;

      paginationContainer.innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openReader(title, pdfUrl) {
      document.getElementById('modal-doc-title').innerText = title;
      document.getElementById('modal-frame-wrapper').innerHTML = `<iframe src="${pdfUrl}"></iframe>`;
      document.getElementById('modal-reader').classList.add('active');
    }

    function closeReader() {
      document.getElementById('modal-frame-wrapper').innerHTML = '';
      document.getElementById('modal-reader').classList.remove('active');
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active', sidebar.classList.contains('open'));
    }

    document.getElementById('btn-open-sidebar').addEventListener('click', toggleSidebar);
    document.getElementById('btn-close-sidebar').addEventListener('click', toggleSidebar);
    backdrop.addEventListener('click', toggleSidebar);
    document.getElementById('btn-close-modal').addEventListener('click', closeReader);

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredData = catalogData.filter(item => item.titulo.toLowerCase().includes(query));
      currentPage = 1;
      renderCurrentPage();
    });

    document.getElementById('btn-grid-mode').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-list-mode').classList.remove('active');
      catalogContainer.className = 'catalog-grid';
    });
    document.getElementById('btn-list-mode').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-grid-mode').classList.remove('active');
      catalogContainer.className = 'catalog-grid list-view';
    });

    document.addEventListener('DOMContentLoaded', () => {
      carregarModulo('eletrodinamica');
    });
  </script>
</body>
</html>
