<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKS Militar</title>
    <style>
        :root {
            --bg: #0b0f19;
            --text: #f8fafc;
            --accent: #38bdf8;
            --border: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            max-width: 800px;
            width: 100%;
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 8px;
            background: #111827;
        }
        h1 {
            color: var(--accent);
            font-size: 1.75rem;
            margin-top: 0;
            letter-spacing: 0.5px;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>LKS MILITAR</h1>
        <p>Official repository for engineering simulations, technical documentation, and tactical analysis systems.</p>
    </div>
</body>
</html>
