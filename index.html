<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LKSMILITAR - Dynamic Technical Library</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #06090e;
      --bg-card: #0d131e;
      --bg-card-hover: #141c2d;
      --border-color: #1e293b;
      --border-accent: rgba(56, 189, 248, 0.3);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    html, body { width: 100%; min-height: 100dvh; background: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 75%);
      pointer-events: none; z-index: 0;
    }

    .sidebar {
      position: fixed; top: 0; left: 0; height: 100dvh; width: 80px;
      background: #090e17; border-right: 1px solid var(--border-color);
      padding: 16px 12px; z-index: 99; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; backdrop-filter: blur(10px);
    }
    .sidebar.open { width: 280px; }
    
    .logo-details { height: 50px; display: flex; align-items: center; position: relative; margin-bottom: 20px; }
    .logo-details i.icon { color: var(--accent-color); font-size: 26px; min-width: 56px; text-align: center; filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .logo-name { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; opacity: 0; transition: 0.2s; white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
    .sidebar.open .logo-name { opacity: 1; }
    .logo-details #btn-toggle { position: absolute; right: 0; font-size: 22px; color: var(--text-muted); cursor: pointer; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box input {
      font-size: 13px; color: var(--text-main); outline: none; height: 42px; width: 100%;
      border: 1px solid var(--border-color); border-radius: 8px; background: #05080f; padding: 0 12px 0 42px;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
    .search-box i { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); font-size: 18px; color: var(--text-muted); }

    .nav-list { flex: 1; overflow-y: auto; list-style: none; }
    .nav-list li { margin-bottom: 6px; }
    .nav-list a { display: flex; height: 44px; border-radius: 8px; align-items: center; text-decoration: none; transition: 0.2s; cursor: pointer; border: 1px solid transparent; }
    .nav-list a:hover, .nav-list a.active { background: var(--bg-card-hover); border-color: var(--border-accent); }
    .nav-list a i { height: 44px; min-width: 56px; font-size: 20px; text-align: center; line-height: 44px; color: var(--accent-color); }
    .nav-list a .link-name { color: #cbd5e1; font-size: 13px; font-weight: 600; opacity: 0; white-space: nowrap; transition: 0.2s; }
    .sidebar.open .nav-list a .link-name { opacity: 1; }

    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 98; opacity: 0; pointer-events: none; transition: 0.3s; }
    .sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

    .main-wrapper { margin-left: 80px; padding: 28px 36px; transition: margin-left 0.3s; width: calc(100% - 80px); position: relative; z-index: 1; }
    .sidebar.open ~ .main-wrapper { margin-left: 280px; width: calc(100% - 280px); }

    .top-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
      margin-bottom: 28px; background: var(--bg-card); padding: 18px 26px; border-radius: 12px;
      border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-info h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: #fff; display: flex; align-items: center; gap: 10px; }
    .header-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    
    .view-controls { display: flex; gap: 6px; background: #05080f; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
    .view-btn {
      border: none; background: transparent; padding: 8px 14px; border-radius: 6px; cursor: pointer;
      color: var(--text-muted); font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .view-btn.active { background: var(--bg-card-hover); color: var(--accent-color); border: 1px solid var(--border-accent); }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
    
    .book-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .book-card:hover {
      transform: translateY(-6px); border-color: var(--accent-color);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
    }
    
    .cover-container {
      width: 100%; height: 240px; background: #04070d; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-color); margin-bottom: 12px; position: relative;
    }
    .cover-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .book-card:hover .cover-container img { transform: scale(1.03); }

    .book-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .book-title { font-size: 13px; font-weight: 700; color: var(--text-main); line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: var(--accent-color); background: var(--accent-glow); padding: 3px 8px; border-radius: 4px; display: inline-block; width: fit-content; border: 1px solid var(--border-accent); }

    .catalog-grid.list-view { display: flex; flex-direction: column; gap: 10px; }
    .catalog-grid.list-view .book-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 20px; }
    .catalog-grid.list-view .cover-container { width: 42px; height: 56px; margin-bottom: 0; flex-shrink: 0; }
    .catalog-grid.list-view .book-details { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; margin-left: 16px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; }
    .page-link {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      width: 40px; height: 40px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .page-link.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 800; box-shadow: 0 0 12px var(--accent-glow); }
    .page-link:hover:not(.active):not(:disabled) { border-color: var(--accent-color); color: var(--text-main); }
    .page-link:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(3, 5, 9, 0.92); backdrop-filter: blur(8px);
      z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-window {
      background: var(--bg-card); width: 100%; max-width: 1200px; height: 100%; max-height: 94dvh;
      border-radius: 16px; border: 1px solid var(--border-accent); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
    }
    .modal-topbar { padding: 14px 24px; background: #070b12; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-topbar h3 { font-size: 14px; font-weight: 700; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    .modal-close-btn { background: transparent; border: none; font-size: 26px; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
    .modal-close-btn:hover { color: var(--accent-color); }
    .modal-frame-container { flex: 1; width: 100%; height: 100%; background: #000; }
    .modal-frame-container iframe { width: 100%; height: 100%; border: none; }

    @media (max-width: 768px) {
      .sidebar { position: fixed !important; transform: translateX(-100%) !important; width: 260px !important; }
      .sidebar.open { transform: translateX(0) !important; }
      .sidebar.open .logo-name, .sidebar.open .nav-list a .link-name { opacity: 1 !important; }
      .main-wrapper, .sidebar.open ~ .main-wrapper { margin-left: 0 !important; width: 100% !important; padding: 16px !important; }
      .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; gap: 14px !important; }
      .cover-container { height: 190px !important; }
      .modal-window { max-height: 100dvh !important; border-radius: 0 !important; }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="backdrop"></div>

  <nav class="sidebar" id="sidebar">
    <div class="logo-details">
      <i class='bx bxs-terminal icon'></i>
      <span class="logo-name">LKSMILITAR</span>
      <i class='bx bx-menu-alt-left' id="btn-toggle"></i>
    </div>

    <div class="search-box">
      <i class='bx bx-search'></i>
      <input type="text" id="search-input" placeholder="Filtrar edições...">
    </div>

    <ul class="nav-list" id="menu-list">
      <li>
        <a class="active">
          <i class='bx bxs-folder-open'></i>
          <span class="link-name">Coleção Asas de Guerra</span>
        </a>
      </li>
    </ul>
  </nav>

  <main class="main-wrapper">
    <header class="top-header">
      <div class="header-info">
        <h1><i class='bx bxs-layer' style="color:var(--accent-color)"></i> Coleção Asas de Guerra</h1>
        <p>Acervo técnico especializado de edições e manuais táticos.</p>
      </div>

      <div class="view-controls">
        <button class="view-btn active" id="btn-grid-mode" title="Modo Estante"><i class='bx bx-grid-alt'></i></button>
        <button class="view-btn" id="btn-list-mode" title="Modo Lista"><i class='bx bx-list-ul'></i></button>
      </div>
    </header>

    <section id="catalog-container" class="catalog-grid"></section>
    <nav id="pagination-container" class="pagination"></nav>
  </main>

  <div id="modal-reader" class="modal-backdrop">
    <div class="modal-window">
      <header class="modal-topbar">
        <h3 id="modal-doc-title">DOCUMENTO TÉCNICO</h3>
        <button class="modal-close-btn" id="btn-close-modal">&times;</button>
      </header>
      <div class="modal-frame-container" id="modal-frame-wrapper"></div>
    </div>
  </div>

  <script>
    const R2_BASE = "https://pub-dfac5265440e49cd865941281f2a36c6.r2.dev/collection-asas";
    
    const arquivosList = [
      "Asas de Guerra (Planeta) - 01_text.pdf", "Asas de Guerra (Planeta) - 02_text.pdf",
      "Asas de Guerra (Planeta) - 03_text.pdf", "Asas de Guerra (Planeta) - 04_text.pdf",
      "Asas de Guerra (Planeta) - 05_text.pdf", "Asas de Guerra (Planeta) - 06_text.pdf",
      "Asas de Guerra (Planeta) - 07_text.pdf", "Asas de Guerra (Planeta) - 08_text.pdf",
      "Asas de Guerra (Planeta) - 09_text.pdf", "Asas de Guerra (Planeta) - 10_text.pdf",
      "Asas de Guerra (Planeta) - 11_text.pdf", "Asas de Guerra (Planeta) - 12_text.pdf",
      "Asas de Guerra (Planeta) - 13_text.pdf", "Asas de Guerra (Planeta) - 14_text.pdf",
      "Asas de Guerra (Planeta) - 15_text.pdf", "Asas de Guerra (Planeta) - 16_text.pdf",
      "Asas de Guerra (Planeta) - 17_text.pdf", "Asas de Guerra (Planeta) - 18_text.pdf",
      "Asas de Guerra (Planeta) - 19_text.pdf", "Asas de Guerra (Planeta) - 20_text.pdf",
      "Asas de Guerra (Planeta) - 21_text.pdf", "Asas de Guerra (Planeta) - 22_text.pdf",
      "Asas de Guerra (Planeta) - 23_text.pdf", "Asas de Guerra (Planeta) - 24_text.pdf",
      "Asas de Guerra (Planeta) - 25_text.pdf", "Asas de Guerra (Planeta) - 26_text.pdf",
      "Asas de Guerra (Planeta) - 27_text.pdf", "Asas de Guerra (Planeta) - 28_text.pdf",
      "Asas de Guerra (Planeta) - 29_text.pdf", "Asas de Guerra (Planeta) - 30_text.pdf",
      "Asas de Guerra (Planeta) - 31_text.pdf", "Asas de Guerra (Planeta) - 32_text.pdf",
      "Asas de Guerra (Planeta) - 33_text.pdf", "Asas de Guerra (Planeta) - 34_text.pdf",
      "Asas de Guerra (Planeta) - 35_text.pdf", "Asas de Guerra (Planeta) - 36_text.pdf",
      "Asas de Guerra (Planeta) - 37_text.pdf", "Asas de Guerra (Planeta) - 38_text.pdf",
      "Asas de Guerra (Planeta) - 40_text.pdf", "Asas de Guerra (Planeta) - 41_text.pdf",
      "Asas de Guerra (Planeta) - 42_text.pdf", "Asas de Guerra (Planeta) - 48_text.pdf",
      "Asas de Guerra (Planeta) - 49_text.pdf", "Asas de Guerra (Planeta) - 51_text.pdf",
      "Asas de Guerra (Planeta) - 54_text.pdf"
    ];

    const catalogData = arquivosList.map(file => {
      const baseName = file.replace("_text.pdf", "").replace(".pdf", "");
      const imgName = baseName + ".jpg";
      const num = baseName.split("-").pop().trim();
      return {
        titulo: `Asas de Guerra - Edição ${num}`,
        pdf_url: `${R2_BASE}/${encodeURIComponent(file)}`,
        capa_url: `${R2_BASE}/${encodeURIComponent(imgName)}`,
        formato: "PDF"
      };
    });

    let filteredData = [...catalogData];
    let currentPage = 1;
    const itemsPerPage = 12;

    const catalogContainer = document.getElementById('catalog-container');
    const paginationContainer = document.getElementById('pagination-container');
    const searchInput = document.getElementById('search-input');
    const sidebar = document.getElementById('sidebar');

    function renderCurrentPage() {
      catalogContainer.innerHTML = '';
      
      if (filteredData.length === 0) {
        catalogContainer.innerHTML = '<p style="color:var(--text-muted); font-size:14px; padding: 20px;">Nenhum documento localizado no acervo.</p>';
        paginationContainer.innerHTML = '';
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = currentPage * itemsPerPage;
      const pageItems = filteredData.slice(start, end);

      pageItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="cover-container">
            <img src="${item.capa_url}" alt="${item.titulo}" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 24 24\' fill=\'%2338bdf8\'><path d=\'M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z\'/></svg>';">
          </div>
          <div class="book-details">
            <div class="book-title">${item.titulo}</div>
            <span class="book-badge">${item.formato}</span>
          </div>
        `;
        card.addEventListener('click', () => openReader(item.titulo, item.pdf_url));
        catalogContainer.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / itemsPerPage);
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let html = `<button class="page-link" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class='bx bx-chevron-left'></i></button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-link ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-link" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})"><i class='bx bx-chevron-right'></i></button>`;

      paginationContainer.innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openReader(title, pdfUrl) {
      document.getElementById('modal-doc-title').innerText = title;
      document.getElementById('modal-frame-wrapper').innerHTML = `<iframe src="${pdfUrl}"></iframe>`;
      document.getElementById('modal-reader').classList.add('active');
    }

    function closeReader() {
      document.getElementById('modal-frame-wrapper').innerHTML = '';
      document.getElementById('modal-reader').classList.remove('active');
    }

    document.getElementById('btn-close-modal').addEventListener('click', closeReader);

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredData = catalogData.filter(item => item.titulo.toLowerCase().includes(query));
      currentPage = 1;
      renderCurrentPage();
    });

    document.getElementById('btn-toggle').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('btn-grid-mode').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-list-mode').classList.remove('active');
      catalogContainer.className = 'catalog-grid';
    });
    document.getElementById('btn-list-mode').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-grid-mode').classList.remove('active');
      catalogContainer.className = 'catalog-grid list-view';
    });

    document.addEventListener('DOMContentLoaded', renderCurrentPage);
  </script>
</body>
</html>
